services:
  funpay-cardinal:
    build: .
    image: funpay-cardinal:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - funpay_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  funpay_data:
